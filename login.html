<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - UniCoffee</title>

  <!-- Fonte Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #fbeedb;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-container {
      background: #fffaf3;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      text-align: center;
      color: #4e342e;
      margin-bottom: 1.5rem;
    }

    form label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: bold;
      color: #6d4c41;
    }

    form input,
    form button {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #d7ccc8;
      border-radius: 0.5rem;
      font-size: 1rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    form input:focus {
      border-color: #a1887f;
      box-shadow: 0 0 0 3px rgba(161, 136, 127, 0.2);
      outline: none;
    }

    form button {
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    form button[type="submit"] {
      background-color: #6d4c41;
      color: white;
    }

    form button[type="submit"]:hover {
      background-color: #5d4037;
    }

    form button[type="reset"] {
      background-color: #d7ccc8;
      color: #4e342e;
    }

    form button[type="reset"]:hover {
      background-color: #c8b7af;
    }

    .extra-links {
      text-align: center;
      margin-top: 0.5rem;
    }

    .extra-links a {
      color: #4e342e;
      text-decoration: none;
      font-weight: 500;
      margin: 0 0.5rem;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

    .error-message {
      color: #c62828;
      text-align: center;
      margin-bottom: 1rem;
      background-color: #ffebee;
      padding: 0.5rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Login</h2>


    <form action="login.php" method="POST" autocomplete="off">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required autofocus
             autocomplete="username" aria-label="Digite seu e-mail" />

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required
             autocomplete="current-password" aria-label="Digite sua senha" />

      <button type="submit">Entrar</button>
      <button type="reset">Limpar</button>
    </form>

    <div class="extra-links">
      <a href="cadastro.html">Criar conta</a> |
      <a href="recuperar.html">Esqueci minha senha</a>
    </div>
  </div>
</body>
</html>
