<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro - UniCoffee</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --marrom-escuro: #5d4037;
      --marrom-hover: #4e342e;
      --branco: #ffffff;
      --cinza-claro: #f5f5f5;
      --cinza-texto: #333;
      --vermelho: #d32f2f;
      --cinza-botao: #cccccc;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to right, #fbeec1, #f5e1a4); /* degradê bege claro */
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    

    .form-container {
      background-color: var(--branco);
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 500px;
    }

    h2 {
      text-align: center;
      color: var(--marrom-escuro);
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      color: var(--cinza-texto);
    }

    input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1.25rem;
      border: 1px solid #ccc;
      border-radius: 0.6rem;
      background-color: var(--cinza-claro);
      font-size: 1rem;
      transition: 0.3s;
    }

    input:focus {
      border-color: var(--marrom-escuro);
      background-color: #f0e4d7;
      outline: none;
    }

    .mensagem-erro {
      color: var(--vermelho);
      font-weight: bold;
      margin-bottom: 1rem;
      text-align: center;
      min-height: 1.5rem;
    }

    .botoes {
      display: flex;
      gap: 1rem;
    }

    button {
      width: 100%;
      padding: 0.9rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 0.6rem;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button[type="submit"] {
      background-color: var(--marrom-escuro);
      color: var(--branco);
    }

    button[type="submit"]:hover {
      background-color: var(--marrom-hover);
    }

    button[type="reset"] {
      background-color: var(--cinza-botao);
      color: var(--cinza-texto);
    }

    button[type="reset"]:hover {
      background-color: #b3b3b3;
    }
  </style>
</head>
<body>
  <main class="form-container">
    <h2>Cadastro</h2>
    <form id="cadastroForm" action="cadastrar.php" method="POST" autocomplete="on">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" required autocomplete="name" />

      <label for="dataNascimento">Data de Nascimento</label>
      <input type="date" id="dataNascimento" name="dataNascimento"  required max="" />

      <label for="mae">Nome da mãe</label>
      <input type="text" id="mae" name="mae" required />

      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" required maxlength="14" />

      <label for="cep">CEP</label>
      <input type="text" id="cep" name="cep" required maxlength="9" />

      <label for="endereco">Endereço</label>
      <input type="text" id="endereco" name="endereco" required />

      <label for="complemento">Complemento</label>
      <input type="text" id="complemento" name="complemento" />

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required />

      <label for="telefone">Telefone Celular</label>
      <input type="text" id="telefone" name="telefone" required placeholder="(+55)XX-XXXX-XXXX" />

      <label for="login">Login</label>
      <input type="text" id="login" name="login" required maxlength="6" />

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required minlength="8" maxlength="8" />

      <label for="confirmarSenha">Confirmar Senha</label>
      <input type="password" id="confirmarSenha" required minlength="8" maxlength="8" />

      <p class="mensagem-erro" id="mensagemErro"></p>

      <div class="botoes">
        <button type="submit">Cadastrar</button>
        <button type="reset" id="btnLimpar">Limpar</button>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById('cadastroForm');
    const cpfInput = document.getElementById('cpf');
    const cepInput = document.getElementById('cep');
    const senha = document.getElementById('senha');
    const confirmarSenha = document.getElementById('confirmarSenha');
    const erro = document.getElementById('mensagemErro');
    const nome = document.getElementById('nome');
    const telefone = document.getElementById('telefone');
    const login = document.getElementById('login');

    // Máscara CPF
    cpfInput.addEventListener("input", () => {
      let value = cpfInput.value.replace(/\D/g, "");
      value = value.replace(/(\d{3})(\d)/, "$1.$2")
                   .replace(/(\d{3})(\d)/, "$1.$2")
                   .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
      cpfInput.value = value;
    });

    // Máscara CEP
    cepInput.addEventListener("input", () => {
      let value = cepInput.value.replace(/\D/g, "");
      if (value.length > 5) value = value.replace(/^(\d{5})(\d)/, "$1-$2");
      cepInput.value = value;
    });

    // Preenchimento automático via ViaCEP
    cepInput.addEventListener("blur", () => {
      const cep = cepInput.value.replace(/\D/g, '');
      if (cep.length === 8) {
        fetch(`https://viacep.com.br/ws/${cep}/json/`)
          .then(response => response.json())
          .then(data => {
            if (!data.erro) {
              document.getElementById('endereco').value = `${data.logradouro}, ${data.bairro} - ${data.localidade}/${data.uf}`;
            }
          })
          .catch(() => {});
      }
    });

    // Máscara telefone
    telefone.addEventListener("input", () => {
      let value = telefone.value.replace(/\D/g, "");
      if (value.length > 0) {
        value = value.substring(0, 12);
        let formatted = "";
        if (value.length <= 2) {
          formatted = "(+" + value;
        } else if (value.length <= 4) {
          formatted = "(+" + value.substring(0, 2) + ")" + value.substring(2);
        } else if (value.length <= 8) {
          formatted = "(+" + value.substring(0, 2) + ")" + value.substring(2, 4) + "-" + value.substring(4);
        } else {
          formatted = "(+" + value.substring(0, 2) + ")" + value.substring(2, 4) + "-" + value.substring(4, 8) + "-" + value.substring(8);
        }
        telefone.value = formatted;
      }
    });

    // Validação CPF
    function validarCPF(cpf) {
      cpf = cpf.replace(/[^\d]+/g, '');
      if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) return false;

      let soma = 0;
      for (let i = 0; i < 9; i++) soma += parseInt(cpf.charAt(i)) * (10 - i);
      let resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      if (resto !== parseInt(cpf.charAt(9))) return false;

      soma = 0;
      for (let i = 0; i < 10; i++) soma += parseInt(cpf.charAt(i)) * (11 - i);
      resto = (soma * 10) % 11;
      if (resto === 10 || resto === 11) resto = 0;
      return resto === parseInt(cpf.charAt(10));
    }

    function validarNome(nome) {
      const regex = /^[A-Za-zÀ-ÿ\s]{15,80}$/;
      return regex.test(nome);
    }

    function validarTelefone(tel) {
      const regex = /^\(\+55\)\d{2}-\d{4}-\d{4}$/;
      return regex.test(tel);
    }

    function validarLogin(login) {
      const regex = /^[A-Za-z]{6}$/;
      return regex.test(login);
    }

    function validarSenha(senha) {
      const regex = /^[A-Za-z]{8}$/;
      return regex.test(senha);
    }

    form.addEventListener("submit", function (e) {
      erro.textContent = "";

      if (!validarNome(nome.value)) {
        erro.textContent = "Nome deve conter entre 15 e 80 caracteres alfabéticos.";
        e.preventDefault();
        return;
      }

      if (!validarCPF(cpfInput.value)) {
        erro.textContent = "CPF inválido.";
        e.preventDefault();
        return;
      }

      if (!validarTelefone(telefone.value)) {
        erro.textContent = "Telefone deve seguir o formato (+55)XX-XXXX-XXXX.";
        e.preventDefault();
        return;
      }

      if (!validarLogin(login.value)) {
        erro.textContent = "Login deve conter exatamente 6 letras.";
        e.preventDefault();
        return;
      }

      if (!validarSenha(senha.value)) {
        erro.textContent = "Senha deve conter exatamente 8 letras.";
        e.preventDefault();
        return;
      }

      if (senha.value !== confirmarSenha.value) {
        erro.textContent = "As senhas não coincidem.";
        e.preventDefault();
        return;
      }
    });

    document.getElementById('btnLimpar').addEventListener('click', () => {
      erro.textContent = '';
    });
  </script>
</body>
</html>
